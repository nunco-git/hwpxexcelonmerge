function setTcText(doc, tc, val) {

  const zip = await JSZip.loadAsync(bytes);

    const mine = cells.filter(r => r.kind === 'h' && r.sec === si && (String(r.v).trim() !== '' || (opts && opts.allowFilled)));
    if (!mine.length) continue;
    const xml = await zip.file(names[si]).async('string');
    const doc = new DOMParser().parseFromString(xml, 'application/xml');

      const tc = all(tbl, 'tc').find(x => { const a = kid(x, 'cellAddr'); return a && +a.getAttribute('rowAddr') === rec.r && +a.getAttribute('colAddr') === rec.c; });
      if (tc) setTcText(doc, tc, String(rec.v));
    }
    let out = new XMLSerializer().serializeToString(doc);
    if (!out.startsWith('<?xml')) out = '<?xml version="1.0" encoding="UTF-8" standalone="yes" ?>' + out;

}

          const t = [...host.querySelectorAll('td.ed')].find(x => (x.dataset.k || '').includes('@' + pendingFocus));
          if (t) { pendingFocus = null; const sl = t.querySelector('select'); (sl || t).focus(); try { t.scrollIntoView({ block: 'nearest' }); } catch (er) { } }
        }
        renderMine(); applyPresence();
      } catch (e) { console.error(e); vbox.textContent = '서식을 불러오지 못했습니다: ' + e.message; }
      building = false; if (dirty) requestBuild();
    };
    const editing = () => { const a = document.activeElement; return !!(a && a.closest && vbox.contains(a) && a.closest('td.ed')); };
    const requestBuild = () => { if (editing()) { dirty = true; return; } build(); };
    vbox.addEventListener('focusout', () => setTimeout(() => { if (dirty && !building && !editing()) build(); }, 350));
    const addRow = async d => {
      if (isClosed(sheet)) return toast('마감되어 행을 추가할 수 없습니다.');
      const id = ref.collection('rows').doc().id; pendingFocus = id;
      try { await ref.collection('rows').doc(id).set({ si: +d.si, after: d.rk, root: +d.root, src: +d.src, by: u.uid, name: me.name, dept: me.dept, ts: Date.now(), at: TS() }); }
      catch (e) { pendingFocus = null; console.error(e); toast('행 추가 실패 [' + (e.code || '') + ']' + (e.code === 'permission-denied' ? ': 권한이 없거나 마감되었습니다. (Firestore 규칙에 rows 항목이 게시되었는지 확인해 주세요)' : ': ' + e.message)); }
    };
    const delRow = async d => {
      const meta = allRows.find(x => x.id === d.rk); if (!meta || meta.by !== u.uid) return;
      if (allRows.some(x => x.after === d.rk)) return toast('이 행 아래에 다른 행이 추가되어 있어 삭제할 수 없습니다.');
      const cs = Object.values(allCells).filter(c => c.kind === 'x' && c.si === meta.si && String(c.addr).endsWith('@' + d.rk) && c.v !== '');
      if (cs.some(c => c.by !== u.uid)) return toast('다른 사람이 입력한 내용이 있어 삭제할 수 없습니다.');
      if (!confirm('내가 추가한 이 행을 삭제할까요?' + (cs.length ? ` (입력한 ${cs.length}칸의 내용도 함께 지워집니다)` : ''))) return;
      try {
        const b = db.batch(); cs.forEach(c => b.update(ref.collection('cells').doc(c.k), { v: '', at: TS() })); b.delete(ref.collection('rows').doc(d.rk)); await b.commit();
        toast('행을 삭제했습니다.');
      } catch (e) { console.error(e); toast('행 삭제 실패 [' + (e.code || '') + ']: ' + e.message); }
    };
    vbox.addEventListener('click', async e => {
      const b = e.target.closest && e.target.closest('button.rb'); const g = b && b.closest('td.rh'); if (!g) return;
      b.disabled = true; try { if (b.dataset.act === 'add') await addRow(g.dataset); else await delRow(g.dataset); } finally { b.disabled = false; }
    });
    subs.push(ref.collection('cells').onSnapshot(s => { s.docChanges().forEach(ch => { if (ch.type !== 'removed') { const dt = ch.doc.data({ serverTimestamps: 'estimate' }); allCells[ch.doc.id] = dt; if (view) view.update(ch.doc.id, dt); } }); renderMine(); }, e => toast('입력 내용을 불러오지 못했습니다 [' + (e.code || '') + ']')));
    subs.push(ref.collection('presence').onSnapshot(s => { presDocs = {}; s.forEach(d => presDocs[d.id] = d.data()); applyPresence(); }, () => { }));
    subs.push(ref.collection('rows').onSnapshot(s => {
      allRows = s.docs.map(d => ({ id: d.id, ...d.data() }));
      const sig = allRows.map(d => d.id + d.after).sort().join('|');
      if (rowsReady && sig === rowSig) return; rowSig = sig; rowsReady = true; requestBuild();
    }, e => { console.error(e); if (!rowsReady) { rowsReady = true; requestBuild(); } toast('추가된 행 정보를 불러오지 못했습니다 [' + (e.code || '') + '] (Firestore 규칙에 rows 항목이 있어야 합니다)'); }));
    subs.push(ref.onSnapshot(s => { if (s.exists) { const was = gutterOn(); sheet = { id: sid, ...s.data() }; if (was !== gutterOn() && rowsReady) requestBuild(); } }));
  } catch (e) { $('#vbox').innerHTML = '서식을 불러오지 못했습니다: ' + esc(e.message); }
}

/* =====================================================

  u = u || auth.currentUser; clearSubs();

async function deleteSheet(id, pre) {
  if (!confirm('이 파일과 입력된 모든 내용·이력을 삭제합니다. 되돌릴 수 없습니다. 삭제할까요?')) return false;
  try {
    if (pre) pre();
    const ref = db.collection('sheets').doc(id);
    for (const c of ['cells', 'log', 'people', 'rows', 'presence', 'chunks']) for (;;) { const s = await ref.collection(c).limit(400).get(); if (s.empty) break; const b = db.batch(); s.docs.forEach(d => b.delete(d.ref)); await b.commit(); }
    await ref.delete(); toast('삭제했습니다.'); return true;
  } catch (e) { toast('삭제 실패: ' + e.message); return false; }
}
function editModal(sheet, onDone) {
  const dl = sheet.deadlineAt ? new Date(sheet.deadlineAt.toDate().getTime() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16) : '';
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="box"><h2 style="margin:0 0 6px">파일 정보 수정</h2>
    <label>제목</label><input id="et" style="width:100%" value="${esc(sheet.title)}">
    <label>마감 일시 (비우면 마감 없음)</label><input type="datetime-local" id="ed" value="${dl}">
    <label><input type="checkbox" id="ea" ${sheet.allowFilled ? 'checked' : ''}> 이미 내용이 있는 칸도 수정 가능</label>
    ${sheet.type === 'xlsx' ? `<label><input type="checkbox" id="er2" ${sheet.allowAddRows ? 'checked' : ''}> 입력자가 표에 행 추가 허용 (같은 서식의 행을 아래에 추가)</label>` : ''}
    <label>비밀번호 ${sheet.pwHash ? '(설정됨)' : '(없음)'}</label><input id="ep" style="width:100%" placeholder="바꾸려면 새 비밀번호 입력, 그대로 두려면 비워 두세요">
    ${sheet.pwHash ? '<label><input type="checkbox" id="er"> 비밀번호 삭제</label>' : ''}
    <div class="muted" style="margin-top:6px">파일 내용 자체는 바꿀 수 없습니다. 서식을 바꾸려면 새로 등록해 주세요.</div>
    <div class="row" style="margin-top:14px;justify-content:flex-end"><button id="ec">취소</button><button class="pri" id="es">저장</button></div></div>`;
  document.body.appendChild(m);
  $('#ec').onclick = () => m.remove();
  $('#es').onclick = async () => {
    const upd = { title: $('#et').value.trim() || sheet.title, allowFilled: $('#ea').checked };
    if ($('#er2')) upd.allowAddRows = $('#er2').checked;
    upd.deadlineAt = $('#ed').value ? firebase.firestore.Timestamp.fromDate(new Date($('#ed').value)) : firebase.firestore.FieldValue.delete();
    const pw = $('#ep').value;
    if (pw) upd.pwHash = await sha(sheet.id + pw); else if ($('#er') && $('#er').checked) upd.pwHash = firebase.firestore.FieldValue.delete();
    try { await db.collection('sheets').doc(sheet.id).update(upd); m.remove(); toast('수정했습니다.'); onDone && onDone(); }
    catch (e) { toast('수정 실패: ' + e.message); }
  };
}
function linkOf(id) { return location.origin + location.pathname + '?s=' + id; }
function copyLink(id) { navigator.clipboard.writeText(linkOf(id)).then(() => toast('링크를 복사했습니다.'), () => prompt('링크를 복사하세요', linkOf(id))); }

function newForm(u) {
  app.innerHTML = adminBar(u) + `<div class="wrap"><div class="card" style="max-width:620px"><h2>새 파일 등록</h2>
    <div class="warn"><b>개인정보·보안 사항이 들어 있는 파일은 올리지 마세요.</b><br>올린 파일은 Firebase에 저장되며, 링크를 가진 사람이 내용을 볼 수 있습니다.</div>
    <label>제목</label><input id="nt" style="width:100%" placeholder="예: 2026년 하반기 부서별 현황">
    <label>파일 (.xlsx 또는 .hwpx, 5MB 이하)</label><input type="file" id="nf" accept=".xlsx,.hwpx">
    <div class="muted">.xls / .hwp 파일은 엑셀·한글에서 .xlsx / .hwpx로 다시 저장한 뒤 올려 주세요.</div>
    <label><input type="checkbox" id="na"> 이미 내용이 있는 칸도 수정 가능하게 (기본: 빈 칸만 입력)</label>
    <label><input type="checkbox" id="nr" checked> 입력자가 표에 행 추가 허용 (엑셀만 · 같은 서식의 행을 아래에 추가)</label>
    <label>비밀번호 (선택)</label><input id="np" placeholder="없으면 비워 두세요">
    <label>마감 일시 (선택)</label><input type="datetime-local" id="nd">
    <div class="row" style="margin-top:16px"><button class="pri" id="ns">등록하고 링크 만들기</button><button id="nc">취소</button></div></div></div>`;
  bindBar(); $('#nc').onclick = () => dashboard(u);
  $('#ns').onclick = async () => {
    const f = $('#nf').files[0], title = $('#nt').value.trim();
    if (!f) return toast('파일을 선택해 주세요.');
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    if (!['xlsx', 'hwpx'].includes(ext)) return toast('.xlsx 또는 .hwpx 파일만 올릴 수 있습니다.');
    if (f.size > MAX_FILE) return toast('파일이 5MB를 넘습니다.');
    const btn = $('#ns'); btn.disabled = true; btn.textContent = '등록 중…';
    try {
      const bytes = new Uint8Array(await f.arrayBuffer());
      const sheetData = { title: title || f.name.replace(/\.[^.]+$/, ''), type: ext, fileName: f.name, allowFilled: $('#na').checked, allowAddRows: ext === 'xlsx' && $('#nr').checked, closed: false, ownerUid: u.uid, ownerName: u.displayName || u.email || '', createdAt: TS() };
      const test = await renderFile(sheetData, bytes);
      if (!test.panes.some(p => p.html.includes('class="ed"'))) { if (!confirm('입력 가능한 빈 칸을 찾지 못했습니다. 그래도 등록할까요?')) throw new Error('취소됨'); }
      const ref = db.collection('sheets').doc();

      for (let i = 0; i < n; i++) await ref.collection('chunks').doc(String(i).padStart(4, '0')).set({ n: i, d: b64.slice(i * CHUNK, (i + 1) * CHUNK) });
      toast('등록되었습니다.'); adminDetail(ref.id);
    } catch (e) { toast('등록 실패: ' + e.message); btn.disabled = false; btn.textContent = '등록하고 링크 만들기'; }
  };
}

    $('#p_log').innerHTML = '불러오는 중…';
    const s = await ref.collection('log').orderBy('at', 'desc').limit(300).get();
    $('#p_log').innerHTML = s.empty ? '<p class="muted">입력 이력이 없습니다.</p>' : `<div class="muted" style="margin-bottom:6px">최근 300건</div><table class="list"><tr><th>일시</th><th>입력자</th><th>위치</th><th>이전 값</th><th>입력 값</th></tr>${s.docs.map(d => { const x = d.data({ serverTimestamps: 'estimate' }); return `<tr><td>${fmt(x.at)}</td><td>${esc(x.name)}${x.dept ? ' (' + esc(x.dept) + ')' : ''}</td><td>${esc(x.label)}</td><td>${esc(x.prev)}</td><td>${esc(x.v)}</td></tr>`; }).join('')}</table>`;
  };
  const showTab = t => {
    tab = t;
    document.querySelectorAll('[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === t));
    ['res', 'ppl', 'log'].forEach(x => $('#p_' + x).style.display = x === t ? '' : 'none');
    if (t === 'log') loadLog(); else refresh();
  };
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => showTab(b.dataset.t));
  $('#fl').onchange = () => view && view.setFilter($('#fl').value);

  let bytes, getRows = () => [];
  try {
    bytes = await loadBytes(id);
    const vb = $('#vbox'); let allRows = [], allCells = {}, rowSig = null, rowsReady = false, building = false, again = false;
    const build = async () => {
      if (building) { again = true; return; } building = true; again = false;
      try {
        const tabI = Math.max(0, [...vb.querySelectorAll('[data-tab]')].findIndex(b => b.classList.contains('on')));
        const sc = [...vb.querySelectorAll('.pane')].map(p => [p.scrollLeft, p.scrollTop]);
        const r = await renderFile(sheet, bytes, { rows: allRows });
        view = mountView(vb, r, { editable: false });
        for (const k in allCells) view.update(k, allCells[k]);
        view.setFilter($('#fl').value);
        const tb = vb.querySelectorAll('[data-tab]')[tabI]; if (tb && tabI) tb.click();
        vb.querySelectorAll('.pane').forEach((p, i) => { if (sc[i]) { p.scrollLeft = sc[i][0]; p.scrollTop = sc[i][1]; } });
        refresh();
      } catch (e) { console.error(e); vb.textContent = '서식을 불러오지 못했습니다: ' + e.message; }
      building = false; if (again) build();
    };
    getRows = () => allRows;
    subs.push(ref.collection('cells').onSnapshot(s => { s.docChanges().forEach(ch => { if (ch.type !== 'removed') { const dt = ch.doc.data({ serverTimestamps: 'estimate' }); allCells[ch.doc.id] = dt; if (view) view.update(ch.doc.id, dt); } }); refresh(); }));
    subs.push(ref.collection('rows').onSnapshot(s => {
      allRows = s.docs.map(d => ({ id: d.id, ...d.data() }));
      const sig = allRows.map(d => d.id + d.after).sort().join('|');
      if (rowsReady && sig === rowSig) return; rowSig = sig; rowsReady = true; build();
    }, e => { console.error(e); if (!rowsReady) { rowsReady = true; build(); } toast('추가된 행 정보를 불러오지 못했습니다 [' + (e.code || '') + '] (Firestore 규칙에 rows 항목을 추가·게시해 주세요)'); }));
    subs.push(ref.collection('people').onSnapshot(s => { people = {}; s.forEach(d => people[d.id] = d.data()); refresh(); }));
    subs.push(ref.onSnapshot(s => { if (s.exists) { sheet = { id, ...s.data() }; paintHead(); } }));
  } catch (e) { $('#vbox').textContent = '서식을 불러오지 못했습니다: ' + e.message; }

  $('#dl').onclick = async () => {
    if (!view) return; const b = $('#dl'); b.disabled = true;
    try {
      const list = cellList().concat(Object.values(view.cells).filter(r => r.v === ''));
      const blob = sheet.type === 'xlsx' ? await buildXlsx(bytes, list, getRows()) : await buildHwpx(bytes, list, sheet);
      dlBlob(blob, sheet.fileName.replace(/\.[^.]+$/, '') + '_취합.' + sheet.type);
    } catch (e) { toast('다운로드 실패: ' + e.message); }
    b.disabled = false;
  };
  $('#dp').onclick = async () => {
    try {
      const wb = new ExcelJS.Workbook();
      const w1 = wb.addWorksheet('입력자'); w1.columns = [{ header: '이름', width: 14 }, { header: '부서', width: 18 }, { header: '입력한 칸 수', width: 14 }, { header: '최근 입력', width: 20 }];
      people_stats().forEach(p => w1.addRow([p.name, p.dept || '', p.n, p.last && p.last.toDate ? p.last.toDate().toLocaleString('ko-KR') : '']));
      const w2 = wb.addWorksheet('입력이력'); w2.columns = [{ header: '일시', width: 20 }, { header: '이름', width: 12 }, { header: '부서', width: 16 }, { header: '위치', width: 22 }, { header: '이전 값', width: 24 }, { header: '입력 값', width: 24 }];
      const s = await ref.collection('log').orderBy('at').limit(5000).get();
      s.forEach(d => { const x = d.data({ serverTimestamps: 'estimate' }); w2.addRow([x.at && x.at.toDate ? x.at.toDate().toLocaleString('ko-KR') : '', x.name, x.dept || '', x.label, x.prev, x.v]); });
      const w3 = wb.addWorksheet('칸별 현재값'); w3.columns = [{ header: '위치', width: 22 }, { header: '입력 값', width: 30 }, { header: '입력자', width: 12 }, { header: '부서', width: 16 }, { header: '입력 일시', width: 20 }];
      cellList().forEach(r => w3.addRow([r.label, r.v, r.name, r.dept || '', r.at && r.at.toDate ? r.at.toDate().toLocaleString('ko-KR') : '']));
      dlBlob(new Blob([await wb.xlsx.writeBuffer()], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), sheet.title + '_입력자정보.xlsx');
    } catch (e) { toast('다운로드 실패: ' + e.message); }
  };
  $('#ei').onclick = () => editModal(sheet, () => adminDetail(id));
  $('#rm').onclick = async () => { if (await deleteSheet(id, clearSubs)) dashboard(u); };
}
</script>
</body>
</html>
