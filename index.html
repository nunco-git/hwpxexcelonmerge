<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>링크 입력 취합</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;background:#eef0f3;color:#222;font-size:14px}
.top{height:6px;background:linear-gradient(90deg,#f59e0b 33%,#22c55e 33% 66%,#3b82f6 66%)}
.bar{background:#fff;border-bottom:1px solid #dde1e6;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar h1{font-size:17px;margin:0;flex:1}
.wrap{max-width:100%;margin:0 auto;padding:14px 20px}
.card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 3px #0002;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:16px}
button,.btn{font:inherit;border:1px solid #cfd4da;background:#fff;border-radius:7px;padding:7px 12px;cursor:pointer}
button:hover{background:#f4f6f8}
button.pri{background:#2563eb;color:#fff;border-color:#2563eb}
button.pri:hover{background:#1d4ed8}
button.dan{color:#b91c1c;border-color:#e7b4b4}
button:disabled{opacity:.5;cursor:default}
input,select{font:inherit;padding:7px 9px;border:1px solid #cfd4da;border-radius:7px;max-width:100%}
label{display:block;margin:10px 0 4px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:#6b7280;font-size:13px}
.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:8px;padding:10px 12px;margin:10px 0}
.tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.tabs button.on{background:#2563eb;color:#fff;border-color:#2563eb}
table.list{border-collapse:collapse;width:100%}
table.list th,table.list td{border-bottom:1px solid #eceff2;padding:8px 6px;text-align:left}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:#e5e7eb}
.badge.ok{background:#dcfce7;color:#166534}.badge.no{background:#fee2e2;color:#991b1b}
.scroll{overflow:auto;max-height:72vh;border:1px solid #e3e6ea;background:#fff}
table.xt,table.ht{border-collapse:collapse;table-layout:fixed;background:#fff}
table.xt td,table.ht td{white-space:pre-wrap;word-break:break-all;padding:2px 4px;vertical-align:middle;font-size:13px;overflow:hidden}
table.ht{margin:8px;table-layout:auto}
table.ht td{border:1px solid #999}
table.ht td.lk{background:#f6f6f6}
td.ed{cursor:text;outline:1px dashed #93c5fd;outline-offset:-1px}
td.ed:focus{outline:2px solid #2563eb;background:#eff6ff!important}
td.ed select{width:100%;border:0;background:transparent}
.hp{padding:3px 10px;white-space:pre-wrap;font-size:13px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:99;max-width:90vw}
.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal .box{background:#fff;border-radius:12px;padding:20px;width:380px;max-width:100%}
.center{max-width:460px;margin:60px auto;text-align:center}
.legend span{display:inline-block;padding:2px 8px;border-radius:10px;margin:2px;font-size:12px}
.fillh{position:absolute;width:9px;height:9px;background:#2563eb;border:1px solid #fff;cursor:crosshair;display:none;z-index:5;touch-action:none}
.fillsel{outline:2px dashed #2563eb!important;outline-offset:-2px}
td.rh{width:30px;min-width:30px;background:#f3f4f6!important;border:1px solid #e4e4e4;text-align:center;padding:0!important;white-space:nowrap;vertical-align:middle}
td.rh.nr{background:#ecfdf5!important}
button.rb{border:0;background:transparent;color:#2563eb;padding:0 3px;border-radius:4px;font-size:13px;line-height:1.1;opacity:.45}
button.rb.dan{color:#b91c1c}
tr:hover button.rb,button.rb:focus{opacity:1}
td[data-pres]{position:relative}
td[data-pres]::before{content:attr(data-pres);position:absolute;top:0;right:0;font-size:10px;line-height:1.3;background:#fef3c7;color:#92400e;padding:0 4px;pointer-events:none;white-space:nowrap}

.hero-title{flex:0 0 26%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;background:linear-gradient(160deg,#fff7ed,#ffedd5);border:1px solid #fed7aa;border-radius:14px;padding:22px 12px;box-shadow:0 1px 3px rgba(194,65,12,.06);transition:.18s}
.hero-title:hover{border-color:#fdba74;box-shadow:0 6px 16px rgba(194,65,12,.12);transform:translateY(-1px)}
.hero-ico{font-size:2.4rem;line-height:1}
.hero-name{margin:0!important;color:#9a3412;font-size:1.7rem!important;font-weight:700;line-height:1.3;letter-spacing:-.3px}
.hero-sub{color:#b45309;font-size:.8rem;font-weight:600}

.sec-banner:hover{border-color:#86efac;box-shadow:0 6px 16px rgba(22,163,74,.12);transform:translateY(-1px)}
.sec-banner>strong{display:block;font-size:16px;color:#15803d;margin-bottom:10px}
.feats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}

.feats b{color:#14532d}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 16px}
.stp{background:#eff6ff;border:1px solid #bfdbfe;border-radius:14px;padding:14px 16px;color:#1e3a8a;font-size:.86rem;line-height:1.55;transition:.18s}

.stp b{font-size:.95rem}
.login-box{background:#fff;color:#334155;border:1px solid #e2e8f0;border-radius:14px;padding:18px 20px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.05)}

  throw new Error('no config');

firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();
db.settings({ ignoreUndefinedProperties: true, experimentalAutoDetectLongPolling: true, merge: true });
const TS = firebase.firestore.FieldValue.serverTimestamp;

/* ---------- 파일 저장/읽기 (Firestore 조각 저장) ---------- */
async function loadBytes(id) {
  const snap = await db.collection('sheets').doc(id).collection('chunks').orderBy('n').get();
  let s = ''; snap.forEach(d => s += d.data().d);
  return b64ToBytes(s);
}

/* ---------- XML 도우미 (hwpx) ---------- */
const kids = (el, n) => [...el.children].filter(c => c.localName === n);
const kid = (el, n) => kids(el, n)[0];
const all = (el, n) => [...el.getElementsByTagNameNS('*', n)];
const within = (el, n) => { for (let p = el.parentNode; p && p.nodeType === 1; p = p.parentNode) if (p.localName === n) return true; return false; };

/* ---------- 숫자 서식 (엑셀 표시 형식 흉내) ---------- */
function toNum(s) {
  const t = String(s).trim();
  if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(t)) return Number(t.replace(/,/g, ''));
  if (/^-?\d+(\.\d+)?$/.test(t) && !/^-?0\d/.test(t) && t.replace(/[-.]/g, '').length <= 15) return Number(t);
  return null;
}
function fmtNum(n, nf) {
  if (typeof n !== 'number' || !isFinite(n) || !nf) return null;
  const secs = nf.split(';'); const useAbs = n < 0 && !!secs[1];
  let f = useAbs ? secs[1] : secs[0];
  f = f.replace(/\[\$([^\]\-]*)[^\]]*\]/g, '$1').replace(/\[[^\]]*\]/g, '');
  const lit = [];
  const hold = c => { lit.push(c); return '\u0001' + (lit.length - 1) + '\u0002'; };
  f = f.replace(/"([^"]*)"/g, (m, s) => hold(s)).replace(/\\(.)/g, (m, c) => hold(c)).replace(/[_*]./g, '');
  if (/[ymdhse]/i.test(f.replace(/\u0001\d+\u0002/g, ''))) return null;
  const m = f.match(/[#0?][#0?,]*(\.[0#?]*)?/);
  if (!m) return null;
  const core = m[0], dec = (core.split('.')[1] || '').length, thou = /,/.test(core.split('.')[0]);
  const pre = f.slice(0, m.index), suf = f.slice(m.index + core.length);
  let v = useAbs ? Math.abs(n) : n; if (/%/.test(pre + suf)) v *= 100;
  const [ip0, fp] = Math.abs(v).toFixed(dec).split('.');
  const zp = (core.split('.')[0].match(/0/g) || []).length;
  const ipp = ip0.padStart(zp, '0');
  const ip = thou ? ipp.replace(/\B(?=(\d{3})+(?!\d))/g, ',') : ipp;
  const back = t => t.replace(/\u0001(\d+)\u0002/g, (x, i) => lit[+i]);
  return (v < 0 && !useAbs ? '-' : '') + back(pre) + ip + (fp ? '.' + fp : '') + back(suf);
}

/* ---------- 수식 계산 (fast-formula-parser + 보완 함수) ---------- */
function parseCfRange(t) { const m = /^\$?([A-Z]+)\$?(\d+)(?::\$?([A-Z]+)\$?(\d+))?$/.exec(String(t).replace(/^.*!/, '')); if (!m) return null; const p1 = a1ToRC(m[1] + m[2]), p2 = m[3] ? a1ToRC(m[3] + m[4]) : p1; return { r1: Math.min(p1[0], p2[0]), c1: Math.min(p1[1], p2[1]), r2: Math.max(p1[0], p2[0]), c2: Math.max(p1[1], p2[1]) }; }
function a1ToRC(a) { const m = /^([A-Z]+)(\d+)$/.exec(a); let c = 0; for (const ch of m[1]) c = c * 26 + ch.charCodeAt(0) - 64; return [+m[2], c]; }
function critFn(c) {
  if (typeof c === 'number') return v => typeof v === 'number' && v === c;
  if (typeof c === 'boolean') return v => v === c;
  c = c == null ? '' : String(c);
  const m = /^(>=|<=|<>|>|<|=)?([\s\S]*)$/.exec(c), op = m[1] || '=', rhs = m[2];
  const toN = v => typeof v === 'number' ? v : (typeof v === 'string' && v.trim() !== '' && !isNaN(Number(v)) ? Number(v) : null);
  const n = rhs.trim() !== '' && !isNaN(Number(rhs)) ? Number(rhs) : null;
  if (n !== null) return v => { const x = toN(v); if (x === null) return op === '<>'; return op === '=' ? x === n : op === '<>' ? x !== n : op === '>' ? x > n : op === '<' ? x < n : op === '>=' ? x >= n : x <= n; };
  const re = new RegExp('^' + rhs.replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/~\*/g, '\u0003').replace(/~\?/g, '\u0004').replace(/\*/g, '[\\s\\S]*').replace(/\?/g, '[\\s\\S]').replace(/\u0003/g, '\\*').replace(/\u0004/g, '\\?') + '$', 'i');
  return v => { const s = v == null ? '' : String(v); if (op === '=') return re.test(s); if (op === '<>') return !re.test(s); const a = s.toLowerCase(), b = rhs.toLowerCase(); return op === '>' ? a > b : op === '<' ? a < b : op === '>=' ? a >= b : a <= b; };
}
function buildFunctions(FP) {
  const H = FP.FormulaHelpers, T = FP.Types, FE = FP.FormulaError;
  const numsOf = p => { const a = []; H.flattenParams(p, T.NUMBER, true, v => { if (typeof v === 'number') a.push(v); }); return a; };
  const anyOf = p => { const a = []; H.flattenParams(p, null, true, v => a.push(v)); return a; };
  const flat = p => H.accept(p, T.ARRAY, undefined, true, true);
  const blank = v => v === null || v === undefined || v === '';
  const idxIfs = pairs => {
    if (pairs.length < 2 || pairs.length % 2) throw FE.VALUE;
    const rs = [], cs = [];
    for (let i = 0; i < pairs.length; i += 2) { rs.push(flat(pairs[i])); cs.push(critFn(H.accept(pairs[i + 1]))); }
    const idx = []; for (let k = 0; k < rs[0].length; k++) if (rs.every((r, j) => k < r.length && cs[j](r[k]))) idx.push(k);
    return idx;
  };
  const sum = a => a.reduce((x, y) => x + y, 0);
  return {
    MAX: (...p) => { const a = numsOf(p); return a.length ? a.reduce((x, y) => y > x ? y : x) : 0; },
    MIN: (...p) => { const a = numsOf(p); return a.length ? a.reduce((x, y) => y < x ? y : x) : 0; },
    COUNTA: (...p) => anyOf(p).filter(v => !blank(v)).length,
    COUNTBLANK: (...p) => anyOf(p).filter(blank).length,
    LARGE: (r, k) => { const a = numsOf([r]).sort((x, y) => y - x); k = H.accept(k, T.NUMBER); if (k < 1 || k > a.length) throw FE.NUM; return a[k - 1]; },
    SMALL: (r, k) => { const a = numsOf([r]).sort((x, y) => x - y); k = H.accept(k, T.NUMBER); if (k < 1 || k > a.length) throw FE.NUM; return a[k - 1]; },
    'RANK': (num, ref, order) => { const n = H.accept(num, T.NUMBER), a = numsOf([ref]), asc = order !== undefined && H.accept(order, T.NUMBER) !== 0; if (!a.includes(n)) throw FE.NA; return 1 + a.filter(x => asc ? x < n : x > n).length; },
    'RANK.EQ': (num, ref, order) => { const n = H.accept(num, T.NUMBER), a = numsOf([ref]), asc = order !== undefined && H.accept(order, T.NUMBER) !== 0; if (!a.includes(n)) throw FE.NA; return 1 + a.filter(x => asc ? x < n : x > n).length; },
    SUBTOTAL: (fn, ...p) => {
      const f = H.accept(fn, T.NUMBER) % 100, a = numsOf(p);

        case 2: return a.length;
        case 3: return anyOf(p).filter(v => !blank(v)).length;
        case 4: return a.length ? Math.max.apply(null, a) : 0;
        case 5: return a.length ? Math.min.apply(null, a) : 0;

      let best = -1;

      if (best < 0) throw FE.NA; return best + 1;
    },
    XLOOKUP: (v, look, ret, nf) => {
      const val = H.accept(v), a = flat(look), b = flat(ret); const f = critFn(typeof val === 'string' ? '=' + val : val);
      const i = a.findIndex(x => f(x)); if (i < 0) { if (nf !== undefined) return H.accept(nf); throw FE.NA; }
      return b[i] === undefined ? null : b[i];

async function deleteSheet(id, pre) {

  try {
    if (pre) pre();
    const ref = db.collection('sheets').doc(id);
    for (const c of ['cells', 'log', 'people', 'rows', 'presence', 'marks', 'claims', 'chunks']) for (;;) { const s = await ref.collection(c).limit(400).get(); if (s.empty) break; const b = db.batch(); s.docs.forEach(d => b.delete(d.ref)); await b.commit(); }
    await ref.delete(); toast('삭제했습니다.'); return true;
  } catch (e) { toast('삭제 실패: ' + e.message); return false; }
}

    // 클립보드 API가 막힌 환경(iframe, 비보안 주소 등)용 대체 복사
    let ok = false;
    const inp = document.getElementById('lk');
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
      document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
      ok = document.execCommand('copy');
      ta.remove();
    } catch (e) { ok = false; }
    if (ok) { toast('링크를 복사했습니다.'); }
    else {
      if (inp) { inp.focus(); inp.select(); }
      toast('자동 복사가 안 되어 링크를 선택해 두었습니다. Ctrl+C로 복사해 주세요.');
    }
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => toast('링크를 복사했습니다.'), fallback);
  } else { fallback(); }
}

function newForm(u) {
  app.innerHTML = adminBar(u) + `<div class="wrap"><div class="card" style="max-width:620px"><h2>새 파일 등록</h2>
    <div class="warn"><b>개인정보·보안 사항이 들어 있는 파일은 올리지 마세요.</b><br>올린 파일은 Firebase에 저장되며, 링크를 가진 사람이 내용을 볼 수 있습니다.</div>
    <label>제목</label><input id="nt" style="width:100%" placeholder="예: 2026년 하반기 부서별 현황">
    <label>파일 (.xlsx 또는 .hwpx, 5MB 이하)</label><input type="file" id="nf" accept=".xlsx,.hwpx">
    <div class="muted">.xls / .hwp 파일은 엑셀·한글에서 .xlsx / .hwpx로 다시 저장한 뒤 올려 주세요.</div>
    <label><input type="checkbox" id="na"> 이미 내용이 있는 칸도 수정 가능하게 (기본: 빈 칸만 입력)</label>
    <label>같은 서식을 몇 장 복사할까요? (선택, 1쪽짜리 서식을 여러 명에게 받을 때)</label><input id="nu" type="number" min="1" max="50" style="width:100px" placeholder="예: 10"> <span class="muted">입력하면 서식을 그 수만큼 복사하고, 입력자가 자기 쪽을 선택합니다.</span>
    <label>쪽 이름 (선택, 한 줄에 하나씩)</label><textarea id="nn" rows="3" style="width:100%" placeholder="예:&#10;총무팀&#10;기획팀"></textarea>
    <label>입력자에게 받을 정보 (체크한 항목을 입력자가 반드시 입력합니다)</label><div id="ninfo">${infoChecks(DEFAULT_INFO, 'ni_')}</div>
    <label><input type="checkbox" id="nr" checked> 입력자가 행·열·본문 줄 추가 허용 (엑셀은 행, 한글은 표의 행·열과 본문 줄)</label>
    <label>비밀번호 (선택)</label><input id="np" placeholder="없으면 비워 두세요">
    <label>마감 일시 (선택)</label><input type="datetime-local" id="nd">
    <div class="row" style="margin-top:16px"><button class="pri" id="ns">등록하고 링크 만들기</button><button id="nc">취소</button></div></div></div>`;
  bindBar(); $('#nc').onclick = () => dashboard(u);
  $('#ns').onclick = async () => {
    const f = $('#nf').files[0], title = $('#nt').value.trim();
    if (!f) return toast('파일을 선택해 주세요.');
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    if (!['xlsx', 'hwpx'].includes(ext)) return toast('.xlsx 또는 .hwpx 파일만 올릴 수 있습니다.');
    if (f.size > MAX_FILE) return toast('파일이 5MB를 넘습니다.');
    const infoSel = readInfoChecks('ni_'); if (!infoSel.length) return toast('입력자 정보를 1개 이상 선택해 주세요.');
    const btn = $('#ns'); btn.disabled = true; btn.textContent = '등록 중…';
    try {
      let bytes = new Uint8Array(await f.arrayBuffer());
      const sheetData = { title: title || f.name.replace(/\.[^.]+$/, ''), type: ext, fileName: f.name, allowFilled: $('#na').checked, allowAddRows: $('#nr').checked, infoFields: infoSel, closed: false, ownerUid: u.uid, ownerName: u.displayName || u.email || '', createdAt: TS() };
      const N = parseInt($('#nu').value, 10) || 1;
      if (N > 1) {
        if (N > 50) throw new Error('복사 개수는 50장까지입니다.');
        const names = $('#nn').value.split('\n').map(x => x.trim()).filter(Boolean);
        if (ext === 'xlsx') bytes = await replicateXlsx(bytes, N, names);
        else { const r = await replicateHwpx(bytes, N); bytes = r.bytes; sheetData.unitSize = r.unitSize; }
        if (bytes.length > MAX_FILE) throw new Error('복사한 파일이 5MB를 넘습니다. 복사 개수를 줄여 주세요.');
        sheetData.units = N; sheetData.unitNames = Array.from({ length: N }, (_, i) => names[i] || (i + 1) + '쪽');
      }
      const test = await renderFile(sheetData, bytes);
      if (!test.panes.some(p => p.html.includes('class="ed"'))) { if (!confirm('입력 가능한 빈 칸을 찾지 못했습니다. 그래도 등록할까요?')) throw new Error('취소됨'); }
      const ref = db.collection('sheets').doc();
      const b64 = bytesToB64(bytes), n = Math.ceil(b64.length / CHUNK);
      sheetData.chunkCount = n;
      const pw = $('#np').value; if (pw) sheetData.pwHash = await sha(ref.id + pw);
      if ($('#nd').value) sheetData.deadlineAt = firebase.firestore.Timestamp.fromDate(new Date($('#nd').value));
      await ref.set(sheetData);
      for (let i = 0; i < n; i++) await ref.collection('chunks').doc(String(i).padStart(4, '0')).set({ n: i, d: b64.slice(i * CHUNK, (i + 1) * CHUNK) });
      toast('등록되었습니다.'); adminDetail(ref.id);
    } catch (e) { toast('등록 실패: ' + e.message); btn.disabled = false; btn.textContent = '등록하고 링크 만들기'; }
  };
}

async function adminDetail(id) {
  clearSubs(); const u = auth.currentUser;
  app.innerHTML = adminBar(u) + '<div class="wrap"><div class="card">불러오는 중…</div></div>'; bindBar();
  const ref = db.collection('sheets').doc(id);
  let snap; try { snap = await ref.get(); } catch (e) { toast('열 수 없습니다.'); return dashboard(u); }
  if (!snap.exists) return dashboard(u);
  let sheet = { id, ...snap.data() };
  let view = null, people = {}, tab = 'res', allMarks = {}, hideDel = false, allClaims = {};
  app.innerHTML = adminBar(u) + `<div class="wrap">
    <div class="card"><div class="row"><h2 style="margin:0;flex:1" id="tt"></h2><button id="bk">← 목록</button></div>
      <div class="row" style="margin-top:10px"><input id="lk" readonly style="flex:1;min-width:220px" value="${esc(linkOf(id))}"><button id="cp">링크 복사</button></div>
      <div class="muted" style="margin-top:6px" id="meta"></div>
      <div class="row" style="margin-top:10px"><button class="pri" id="dl">취합 파일 다운로드 (원본 서식)</button><button id="dp">입력자·이력 엑셀</button><button id="ei">정보 수정</button><button id="tg"></button><button class="dan" id="rm">삭제</button></div>
      <div class="muted" style="margin-top:6px">다운로드 파일에는 입력자 정보가 섞이지 않습니다. 엑셀의 차트·그림 등 일부 요소는 변환 과정에서 빠질 수 있으니 중요한 서식은 확인해 주세요.</div></div>
    <div class="card"><div class="tabs"><button data-t="res" class="on">입력 결과</button><button data-t="ppl">입력자</button><button data-t="log">이력</button><button data-t="del">삭제 표시</button>${sheet.units > 1 ? '<button data-t="uni">쪽 배정</button>' : ''}</div>
      <div id="p_res"><div class="row" style="margin-bottom:8px"><span>입력자별 보기</span><select id="fl"><option value="">전체</option></select><span class="muted" id="stat"></span><label class="muted"><input type="checkbox" id="hd"> 삭제 표시된 항목 숨기기</label></div><div id="vbox">서식을 불러오는 중…</div></div>
      <div id="p_ppl" style="display:none"></div><div id="p_log" style="display:none"></div><div id="p_del" style="display:none"></div><div id="p_uni" style="display:none"></div></div></div>`;
  bindBar();
  const paintHead = () => {
    $('#tt').textContent = sheet.title;
    $('#meta').textContent = `${sheet.fileName} · ${sheet.type} · ${isClosed(sheet) ? '마감' : '입력 중'}${sheet.deadlineAt ? ' · 마감 ' + fmt(sheet.deadlineAt) : ''}${sheet.pwHash ? ' · 비밀번호 있음' : ''}`;
    $('#tg').textContent = sheet.closed ? '입력 다시 열기' : '입력 마감';
  };
  paintHead();
  $('#bk').onclick = () => dashboard(u); $('#cp').onclick = () => copyLink(id);
  $('#tg').onclick = async () => { await ref.update({ closed: !sheet.closed }); sheet.closed = !sheet.closed; paintHead(); };
  const cellList = () => Object.values(view ? view.cells : {}).filter(r => r.v !== '');
  const people_stats = () => {
    const m = {};
    for (const [uid, p] of Object.entries(people)) m[uid] = { uid, name: p.name, dept: p.dept, phone: p.phone, n: 0, last: p.lastAt };
    for (const r of cellList()) { const x = m[r.by] || (m[r.by] = { uid: r.by, name: r.name, dept: r.dept, n: 0 }); x.n++; if (r.at && (!x.last || (r.at.toMillis ? r.at.toMillis() : 0) > (x.last.toMillis ? x.last.toMillis() : 0))) x.last = r.at; }
    return Object.values(m).sort((a, b) => b.n - a.n);
  };
  const refresh = () => {
    const ps = people_stats();
    const cur = $('#fl').value;
    $('#fl').innerHTML = '<option value="">전체</option>' + ps.map(p => `<option value="${esc(p.uid)}" ${p.uid === cur ? 'selected' : ''}>${esc(p.name)}${p.dept ? ' (' + esc(p.dept) + ')' : ''} · ${p.n}칸</option>`).join('');
    $('#stat').textContent = view ? `입력된 칸 ${cellList().length} / 입력 가능한 칸 ${view.count} · 참여 ${ps.length}명${getRows().length ? ' · 추가된 행 ' + getRows().length + '개' : ''}` : '';
    if (tab === 'uni') {
      $('#p_uni').innerHTML = `<div class="muted" style="margin-bottom:6px">입력자가 선택한 쪽입니다. 잘못 선택했거나 담당자가 바뀌면 [해제]하세요. (다른 쪽 잠금은 화면에서만 적용됩니다)</div><table class="list"><tr><th>쪽</th><th>담당자</th><th>선택 일시</th><th></th></tr>${Array.from({ length: sheet.units }, (_, i) => { const c = allClaims[i]; return `<tr><td>${esc(unitName(sheet, i))}</td><td>${c ? esc(c.name || '') + (c.dept ? ' (' + esc(c.dept) + ')' : '') : '<span class="muted">비어 있음</span>'}</td><td>${c ? fmt(c.at) : ''}</td><td>${c ? `<button data-rl="${i}">해제</button>` : ''}</td></tr>`; }).join('')}</table>`;
      $('#p_uni').querySelectorAll('[data-rl]').forEach(b => b.onclick = () => ref.collection('claims').doc(b.dataset.rl).delete().catch(e => toast('해제 실패: ' + e.message)));
    }
    if (tab === 'del') {
      const ms = Object.values(allMarks).sort((a, b) => (b.at && b.at.toMillis ? b.at.toMillis() : 0) - (a.at && a.at.toMillis ? a.at.toMillis() : 0));
      $('#p_del').innerHTML = ms.length ? `<div class="muted" style="margin-bottom:6px">다운로드하면 아래 항목이 실제로 삭제됩니다. 필요하면 복원하세요.</div><table class="list"><tr><th>항목</th><th>표시한 사람</th><th>일시</th><th></th></tr>${ms.map(m => `<tr><td>${esc(m.label || m.k)}</td><td>${esc(m.name || '')}${m.dept ? ' (' + esc(m.dept) + ')' : ''}</td><td>${fmt(m.at)}</td><td><button data-rm="${esc(m.k)}">복원</button></td></tr>`).join('')}</table>` : '<p class="muted">삭제 표시된 항목이 없습니다.</p>';
      $('#p_del').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => ref.collection('marks').doc(b.dataset.rm).delete().catch(e => toast('복원 실패: ' + e.message)));
    }
    if (tab === 'ppl') $('#p_ppl').innerHTML = ps.length ? `<table class="list"><tr><th>이름</th><th>소속</th><th>전화번호</th><th>입력한 칸</th><th>최근 입력</th><th></th></tr>${ps.map(p => `<tr><td><span class="legend"><span style="background:hsl(${hue(p.uid)} 75% 90%)">${esc(p.name)}</span></span></td><td>${esc(p.dept || '')}</td><td>${esc(p.phone || '')}</td><td>${p.n}</td><td>${fmt(p.last)}</td><td><button data-u="${esc(p.uid)}">이 사람이 입력한 칸 보기</button></td></tr>`).join('')}</table>` : '<p class="muted">아직 참여한 사람이 없습니다.</p>';
    if (tab === 'ppl') $('#p_ppl').querySelectorAll('[data-u]').forEach(b => b.onclick = () => { $('#fl').value = b.dataset.u; showTab('res'); view && view.setFilter(b.dataset.u); });
  };
  const loadLog = async () => {
    $('#p_log').innerHTML = '불러오는 중…';
    const s = await ref.collection('log').orderBy('at', 'desc').limit(300).get();
    $('#p_log').innerHTML = s.empty ? '<p class="muted">입력 이력이 없습니다.</p>' : `<div class="muted" style="margin-bottom:6px">최근 300건</div><table class="list"><tr><th>일시</th><th>입력자</th><th>위치</th><th>이전 값</th><th>입력 값</th></tr>${s.docs.map(d => { const x = d.data({ serverTimestamps: 'estimate' }); return `<tr><td>${fmt(x.at)}</td><td>${esc(x.name)}${x.dept ? ' (' + esc(x.dept) + ')' : ''}</td><td>${esc(x.label)}</td><td>${esc(x.prev)}</td><td>${esc(x.v)}</td></tr>`; }).join('')}</table>`;
  };
  const showTab = t => {
    tab = t;
    document.querySelectorAll('[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === t));
    ['res', 'ppl', 'log', 'del', 'uni'].forEach(x => $('#p_' + x).style.display = x === t ? '' : 'none');
    if (t === 'log') loadLog(); else refresh();
  };
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => showTab(b.dataset.t));
  $('#fl').onchange = () => view && view.setFilter($('#fl').value);

  let bytes, getRows = () => [];
  try {
    bytes = await loadBytes(id);
    const vb = $('#vbox'); let allRows = [], allCells = {}, rowSig = null, rowsReady = false, building = false, again = false;
    const build = async () => {
      if (building) { again = true; return; } building = true; again = false;
      try {
        const tabI = Math.max(0, [...vb.querySelectorAll('[data-tab]')].findIndex(b => b.classList.contains('on')));
        const sc = [...vb.querySelectorAll('.pane')].map(p => [p.scrollLeft, p.scrollTop]);
        const r = await renderFile(sheet, bytes, { rows: allRows });
        view = mountView(vb, r, { editable: false });
        for (const k in allCells) view.update(k, allCells[k]);
        view.setFilter($('#fl').value); applyMarks(vb, allMarks); applyUnits(vb, sheet, allClaims, '', false); vb.classList.toggle('hidedel', hideDel);
        const tb = vb.querySelectorAll('[data-tab]')[tabI]; if (tb && tabI) tb.click();
        vb.querySelectorAll('.pane').forEach((p, i) => { if (sc[i]) { p.scrollLeft = sc[i][0]; p.scrollTop = sc[i][1]; } });
        refresh();
      } catch (e) { console.error(e); vb.textContent = '서식을 불러오지 못했습니다: ' + e.message; }
      building = false; if (again) build();
    };
    getRows = () => allRows;
    if (sheet.units > 1) subs.push(ref.collection('claims').onSnapshot(s => { allClaims = {}; s.forEach(d => allClaims[+d.id] = d.data()); applyUnits(vb, sheet, allClaims, '', false); refresh(); }, () => { }));
    $('#hd').onchange = () => { hideDel = $('#hd').checked; vb.classList.toggle('hidedel', hideDel); };
    subs.push(ref.collection('marks').onSnapshot(s => { allMarks = {}; s.forEach(d => allMarks[d.id] = d.data()); applyMarks(vb, allMarks); refresh(); }, () => { }));
    subs.push(ref.collection('cells').onSnapshot(s => { s.docChanges().forEach(ch => { if (ch.type !== 'removed') { const dt = ch.doc.data({ serverTimestamps: 'estimate' }); allCells[ch.doc.id] = dt; if (view) view.update(ch.doc.id, dt); } }); refresh(); }));
    subs.push(ref.collection('rows').onSnapshot(s => {
      allRows = s.docs.map(d => ({ id: d.id, ...d.data() }));
      const sig = allRows.map(d => d.id + d.after).sort().join('|');
      if (rowsReady && sig === rowSig) return; rowSig = sig; rowsReady = true; build();
    }, e => { console.error(e); if (!rowsReady) { rowsReady = true; build(); } toast('추가된 행 정보를 불러오지 못했습니다 [' + (e.code || '') + '] (Firestore 규칙에 rows 항목을 추가·게시해 주세요)'); }));
    subs.push(ref.collection('people').onSnapshot(s => { people = {}; s.forEach(d => people[d.id] = d.data()); refresh(); }));
    subs.push(ref.onSnapshot(s => { if (s.exists) { sheet = { id, ...s.data() }; paintHead(); } }));
  } catch (e) { $('#vbox').textContent = '서식을 불러오지 못했습니다: ' + e.message; }

  $('#dl').onclick = async () => {
    if (!view) return; const b = $('#dl'); b.disabled = true;
    try {
      const list = cellList().concat(Object.values(view.cells).filter(r => r.v === ''));
      const blob = sheet.type === 'xlsx' ? await buildXlsx(bytes, list, getRows(), Object.keys(allMarks)) : await buildHwpx(bytes, list, sheet, getRows(), Object.keys(allMarks));
      dlBlob(blob, sheet.fileName.replace(/\.[^.]+$/, '') + '_취합.' + sheet.type);
    } catch (e) { toast('다운로드 실패: ' + e.message); }
    b.disabled = false;
  };
  $('#dp').onclick = async () => {
    try {
      const wb = new ExcelJS.Workbook();
      const w1 = wb.addWorksheet('입력자'); w1.columns = [{ header: '이름', width: 14 }, { header: '소속', width: 22 }, { header: '전화번호', width: 16 }, { header: '입력한 칸 수', width: 14 }, { header: '최근 입력', width: 20 }];
      people_stats().forEach(p => w1.addRow([p.name, p.dept || '', p.phone || '', p.n, p.last && p.last.toDate ? p.last.toDate().toLocaleString('ko-KR') : '']));
      const w2 = wb.addWorksheet('입력이력'); w2.columns = [{ header: '일시', width: 20 }, { header: '이름', width: 12 }, { header: '부서', width: 16 }, { header: '위치', width: 22 }, { header: '이전 값', width: 24 }, { header: '입력 값', width: 24 }];
      const s = await ref.collection('log').orderBy('at').limit(5000).get();
      s.forEach(d => { const x = d.data({ serverTimestamps: 'estimate' }); w2.addRow([x.at && x.at.toDate ? x.at.toDate().toLocaleString('ko-KR') : '', x.name, x.dept || '', x.label, x.prev, x.v]); });
      const w3 = wb.addWorksheet('칸별 현재값'); w3.columns = [{ header: '위치', width: 22 }, { header: '입력 값', width: 30 }, { header: '입력자', width: 12 }, { header: '부서', width: 16 }, { header: '입력 일시', width: 20 }];
      cellList().forEach(r => w3.addRow([r.label, r.v, r.name, r.dept || '', r.at && r.at.toDate ? r.at.toDate().toLocaleString('ko-KR') : '']));
      dlBlob(new Blob([await wb.xlsx.writeBuffer()], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), sheet.title + '_입력자정보.xlsx');
    } catch (e) { toast('다운로드 실패: ' + e.message); }
  };
  $('#ei').onclick = () => editModal(sheet, () => adminDetail(id));
  $('#rm').onclick = async () => { if (await deleteSheet(id, clearSubs)) dashboard(u); };
}
</script>
</body>
</html>
